services:
  mongodb:
    image: mongo:9
    container_name: mongodb
    ports:
      - "27107:27017"
    volumes:
      - ./mongodb:/data/db
    networks:
      - backend
    restart: always

  qdrant:
    image: qdrant/qdrant:v1.20.0
    container_name: qdrant
    ports:
      - "6333:6333"
    volumes:
      - ./qdrant:/qdrant/storage
    networks:
      - backend
    restart: always

networks:
  backend:
